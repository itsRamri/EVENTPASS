name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App & Sync Capacitor
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build:android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Rename APKs for Easy Direct Download
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/EventPass-Debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/EventPass-Release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EventPass-Debug-APK
          path: apk-output/EventPass-Debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: EventPass-Release-APK
          path: apk-output/EventPass-Release.apk

      - name: Create / Update GitHub Release (Direct Download Link)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "EventPass Android App v1.0.0 (Latest Release)"
          body: |
            ## 📱 EventPass Android Application
            
            Download the signed APK directly to your phone below:
            - **[EventPass-Release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/EventPass-Release.apk)** (Recommended)
            - **[EventPass-Debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/EventPass-Debug.apk)**
          files: |
            apk-output/EventPass-Release.apk
            apk-output/EventPass-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
